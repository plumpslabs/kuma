name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (--dry-run)"
        type: boolean
        default: false

jobs:
  # ─── Test + Typecheck ───
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx tsc --noEmit
      - run: pnpm test -- --runInBand

  # ─── Publish to npmjs.com ───
  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Approve sql.js build
        run: pnpm config set onlyBuiltDependencies "sql.js" --location project 2>/dev/null; true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Publish to npm
        run: |
          FLAGS="--access public --no-git-checks"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          pnpm publish $FLAGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish to GitHub Packages ───
  publish-gpr:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@plumpslabs"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build

      - name: Publish to GitHub Packages
        run: |
          FLAGS="--no-git-checks"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          pnpm publish $FLAGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
